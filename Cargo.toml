[workspace.package]
version = "0.0.0-dev" # patched by CI
edition = "2021"

[workspace]
resolver = "2"

members = [
	"gravel",
	"gravel-core",
	"gravel-ffi",
	"gravel-ffi-macros",
	"gravel-frontend-fltk",
	"gravel-provider-calculator",
	"gravel-provider-custom",
	"gravel-provider-exec",
	"gravel-provider-kill",
	"gravel-provider-program",
	"gravel-provider-system",
	"gravel-provider-websearch",
	"gravel-test-utils",

	"examples/example-provider",
]

[workspace.dependencies]
abi_stable = { version = "0.11.3", default-features = false, features = ["channels"] }
anyhow = "1.0.86"
arboard = { version = "3.4.0", default-features = false }
chrono = { version = "0.4.38", default-features = false }
clap = "4.5.8"
clap-verbosity-flag = "3.0.2"
color-eyre = { version = "0.6.3", default-features = false }
enumflags2 = "0.7.10"
fern = "0.7.1"
file-rotate = "0.7.6"
fltk = "1.4.34"
freedesktop_entry_parser = "1.3.0"
fuzzy-matcher = "0.3.7"
glob = "0.3.1"
hostname = "0.4.0"
hotkey = "0.3.1"
itertools = "0.14.0"
lazy_static = "1.5.0"
log = "0.4.22"
mexprp = { version = "0.3.1", default-features = false }
nameof = "1.2.2"
nix = "0.29.0"
nonempty = "0.11.0"
open = "5.2.0"
procfs = { version = "0.17.0", default-features = false }
quote = "1.0.36"
serde = { version = "1.0.204", features = ["derive"] }
shellexpand = "3.1.0"
single-instance = "0.3.3"
stderrlog = { version = "0.6.0", default-features = false }
syn = "2.0.68"
sysinfo = { version = "0.33.1", default-features = false }
system_shutdown = "4.0.1"
thiserror = "2.0.9"
urlencoding = "2.1.3"
winapi = "0.3.9"

# target fork until https://github.com/SergioBenitez/Figment/issues/92 is closed
figment = { version="0.10.19", git = "https://github.com/thorio/figment", branch = "master" }

# dev-dependencies
mockall = "0.13.0"
rstest = "0.24.0"
test_bin = "0.4.0"

[profile.release]
strip = true
lto = true

# improve debug backtrace performance with color-eyre
[profile.dev.package.backtrace]
opt-level = 3

[workspace.lints.rust]
non_ascii_idents = "forbid"
noop_method_call = "warn"
single_use_lifetimes = "warn"
unused_crate_dependencies = "warn"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
cognitive_complexity = "warn"
dbg_macro = "warn"
empty_structs_with_brackets = "warn"
equatable_if_let = "warn"
explicit_iter_loop = "warn"
match_wildcard_for_single_variants = "warn"
or_fun_call = "warn"
print_stderr = "warn"
print_stdout = "warn"
question_mark = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
unwrap_used = "warn"
use_self = "warn"
used_underscore_binding = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
