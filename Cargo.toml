[workspace.package]
version = "0.0.0-dev" # patched by CI
edition = "2024"

[workspace]
resolver = "2"

members = [
	"gravel",
	"gravel-core",
	"gravel-ffi",
	"gravel-ffi-macros",
	"gravel-frontend-fltk",
	"gravel-provider-calculator",
	"gravel-provider-custom",
	"gravel-provider-exec",
	"gravel-provider-kill",
	"gravel-provider-program",
	"gravel-provider-system",
	"gravel-provider-websearch",
	"gravel-test-utils",

	"examples/example-provider",
]

[workspace.dependencies]
abi_stable = { version = "0.11.3", default-features = false, features = ["channels"] }
anyhow = "1.0.100"
arboard = { version = "3.6.1", default-features = false }
chrono = { version = "0.4.42", default-features = false }
clap = "4.5.53"
clap-verbosity-flag = "3.0.4"
color-eyre = { version = "0.6.5", default-features = false }
enumflags2 = "0.7.12"
fern = "0.7.1"
file-rotate = "0.8.0"
fltk = "1.5.22"
freedesktop_entry_parser = "2.0.1"
fuzzy-matcher = "0.3.7"
glob = "0.3.3"
hostname = "0.4.2"
hotkey = "0.3.1"
itertools = "0.14.0"
lazy_static = "1.5.0"
log = "0.4.29"
mexprp = { version = "0.3.1", default-features = false }
nameof = "1.3.0"
nix = "0.30.1"
nonempty = "0.12.0"
open = "5.3.3"
procfs = { version = "0.18.0", default-features = false }
quote = "1.0.42"
serde = { version = "1.0.228", features = ["derive"] }
shellexpand = "3.1.1"
single-instance = "0.3.3"
stderrlog = { version = "0.6.0", default-features = false }
syn = "2.0.111"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
system_shutdown = "4.0.1"
thiserror = "2.0.17"
urlencoding = "2.1.3"
winapi = "0.3.9"

# target fork until https://github.com/SergioBenitez/Figment/issues/92 is closed
figment = { version="0.10.19", git = "https://github.com/thorio/figment", branch = "master" }

# dev-dependencies
mockall = "0.14.0"
rstest = "0.26.1"
test_bin = "0.5.0"

[profile.release]
strip = true
lto = true

# improve debug backtrace performance with color-eyre
[profile.dev.package.backtrace]
opt-level = 3

[workspace.lints.rust]
non_ascii_idents = "forbid"
noop_method_call = "warn"
single_use_lifetimes = "warn"
unused_crate_dependencies = "warn"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
cognitive_complexity = "warn"
dbg_macro = "warn"
empty_structs_with_brackets = "warn"
equatable_if_let = "warn"
explicit_iter_loop = "warn"
match_wildcard_for_single_variants = "warn"
or_fun_call = "warn"
print_stderr = "warn"
print_stdout = "warn"
question_mark = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
unwrap_used = "warn"
use_self = "warn"
used_underscore_binding = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
