[config]
skip_core_tasks = true

# NOTE: github actions windows-2022 has a super old grep version so don't use it without LC_ALL=en_US.utf8
[tasks.patch-version]
script_runner = "sh"
script = '''
	sha=$(git rev-parse --short HEAD)
	tag=$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')
	sed -i "s/0.0.0-dev/$tag+$sha/" Cargo.toml
	sed -i "s/0.0.0_dev/$(echo $tag | sed 's/-/_/g')/" package/arch/PKGBUILD
	sed -i "s/0.0.0-dev/$tag/" package/debian/control
'''

[tasks.artifact-dropoff]
script_runner = "sh"
script = "mkdir -p target/artifacts"

[tasks.release-deb]
dependencies = ["artifact-dropoff", "patch-version"]
condition = { platforms = ["linux"] }
script_runner = "sh"
script = '''
	cargo build --release
	bash package/debian/build.sh
	cp -a package/debian/*.deb target/artifacts/gravel-x86_64.deb
'''

[tasks.release-arch]
dependencies = ["patch-version", "artifact-dropoff"]
condition = { platforms = ["linux"] }
script_runner = "sh"
script = '''
	cargo build --release
	(cd package/arch && makepkg -Cf)
	cp -a package/arch/*.pkg.tar.zst target/artifacts/gravel-x86_64.pkg.tar.zst
'''

[tasks.release-exe]
dependencies = ["artifact-dropoff", "patch-version"]
condition = { platforms = ["windows"] }
script_runner = "sh"
script = '''
	cargo build --release
	rcedit target/release/gravel.exe --set-icon package/icons/icon.ico
	cp -a target/release/gravel.exe target/artifacts/gravel-x86_64.exe
'''
