[config]
skip_core_tasks = true

[tasks.ci-ubuntu]
run_task = { name = ["release-deb", "release-config"] }

[tasks.ci-arch]
run_task = { name = ["release-archpkg"] }

[tasks.ci-windows]
run_task = { name = ["release-zip", "release-msi"] }

# NOTE: github actions windows-2022 has a super old grep version so don't use it without LC_ALL=en_US.utf8
[tasks.patch-version]
script_runner = "sh"
script = '''
	sha=$(git rev-parse --short HEAD)
	tag=$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')
	sed -i "s/0.0.0-dev/$tag+$sha/" Cargo.toml
	sed -i "s/0.0.0_dev/$(echo $tag | sed 's/-/_/g')/" package/arch/PKGBUILD
	sed -i "s/0.0.0-dev/$tag/" package/debian/control
	sed -i "s/0.0.0.0/$(echo $tag | sed 's/[+-].*//g')/" package/windows/installer.wxs
'''

[tasks.artifact-dropoff]
script_runner = "sh"
script = "mkdir -p target/artifacts"

[tasks.release-config]
dependencies = ["artifact-dropoff"]
script_runner = "sh"
script = "cp -a config.yml target/artifacts/config.yml"

[tasks.release-deb]
dependencies = ["artifact-dropoff", "patch-version"]
condition = { platforms = ["linux"] }
script_runner = "sh"
script = '''
	cargo build --release
	bash package/debian/build.sh
	cp -a package/debian/*.deb target/artifacts/gravel-debian-x86_64.deb
'''

[tasks.release-archpkg]
dependencies = ["patch-version", "artifact-dropoff"]
condition = { platforms = ["linux"] }
script_runner = "sh"
script = '''
	cargo build --release
	(cd package/arch && makepkg -Cf)
	cp -a package/arch/*.pkg.tar.zst target/artifacts/gravel-arch-x86_64.pkg.tar.zst
'''

[tasks.windows-exe]
dependencies = ["patch-version"]
condition = { platforms = ["windows"] }
script_runner = "sh"
script = '''
	cargo build --release
	rcedit target/release/gravel.exe --set-icon package/icons/icon.ico
'''

[tasks.release-zip]
dependencies = ["artifact-dropoff", "windows-exe"]
condition = { platforms = ["windows"] }
script_runner = "sh"
script = '''
	mkdir -p target/tmp/zip
	cp LICENSE target/tmp/zip/license.txt
	cp config.yml target/tmp/zip/template-config.yml
	cp target/release/gravel.exe target/tmp/zip/gravel.exe
	(cd target/tmp/zip && 7z a ../../artifacts/gravel-windows-x86_64.zip .)
'''

[tasks.release-msi]
dependencies = ["artifact-dropoff", "windows-exe"]
condition = { platforms = ["windows"] }
script_runner = "sh"
script = '''
	candle -arch x64 package/windows/installer.wxs -o target/installer.wixobj
	light -ext WixUIExtension -spdb target/installer.wixobj -o target/artifacts/gravel-windows-x86_64.msi
'''
